<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大學生記帳與消費分析網站</title>
    <!-- 引入外部 CSS 樣式檔 -->
    <link rel="stylesheet" href="style.css">
    <!-- 引入 Chart.js 圖表套件 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- ================= 0. 密碼解鎖登入遮罩 ================= -->
    <div id="lock-screen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(240, 244, 248, 0.95); z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column;">
        <div style="background: white; padding: 30px 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; max-width: 350px; width: 100%;">
            <h2 id="lock-title" style="margin-top: 0; color: #333;">🔒 金庫已上鎖</h2>
            <p id="lock-desc" style="color: #666; font-size: 14px; margin-bottom: 20px;">請輸入您的密碼以解鎖您的專屬記帳本</p>
            <input type="password" id="lock-password-input" placeholder="請輸入密碼" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px;">
            <button id="lock-submit-btn" style="width: 100%; padding: 10px; background-color: #49596f; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px;">解鎖 / 設定密碼</button>
        </div>
    </div>

    <!-- 左側選單欄 -->
    <div class="sidebar">
        <h2>我的小金庫</h2>
        <a class="menu-btn active" data-target="overview-page">總覽</a>
        <a class="menu-btn" data-target="calendar-page">月曆</a>
        <a class="menu-btn" data-target="budget-page">預算</a>
        <a class="menu-btn" data-target="stats-page">統計</a>
        <a class="menu-btn" data-target="settings-page">設定</a> 
    </div>

    <!-- 右側主畫面容器 -->
    <div class="main-content">
        
       <!-- 個人化歡迎與金庫命名區 -->
            <div class="header-section">
                <h1 id="vault-title" style="margin: 0; font-size: 24px;">我的小金庫</h1>
                <div>
                    <input type="text" id="user-name-input" placeholder="輸入你的名字">
                    <button id="set-name-btn">打造我的小金庫</button>
                </div>
            </div>
        <!-- ================= 1. 總覽頁面 (Overview) ================= -->
        <div id="overview-page" class="page-view active-page">
            <div class="card-container">
                <div class="card">
                    <h4 style="margin: 0; color: #7f8c8d;">今日支出</h4>
                    <p id="today-total" style="font-size: 22px; font-weight: bold; margin: 10px 0 0 0;">$ 0</p>
                </div>
                <div class="card" id="week-card">
                    <h4 style="margin: 0; color: #7f8c8d;">本周已花費 / 預算</h4>
                    <p id="week-total" style="font-size: 22px; font-weight: bold; margin: 10px 0 0 0;">$ 0 / $ --</p>
                </div>
                <div class="card" id="month-card">
                    <h4 style="margin: 0; color: #7f8c8d;">本月已花費 / 預算</h4>
                    <p id="month-total" style="font-size: 22px; font-weight: bold; margin: 10px 0 0 0;">$ 0 / $ --</p>
                </div>
            </div>

            <div class="grid-layout">
                <div class="section-box">
                    <h3>消費紀錄列表</h3>
                    <div class="calendar-mock" id="calendar-view"></div>
                </div>

                <div class="section-box">
                    <h3>快速記帳</h3>
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <input type="date" id="expense-date">
                        <input type="text" id="expense-name" placeholder="消費名稱 (例如: 晚餐)">
                        <input type="number" id="expense-amount" placeholder="金額 (例如: 120)">
                        <select id="expense-category">
                            <option value="food">吃的喝的</option>
                            <option value="transport">交通</option>
                            <option value="entertainment">娛樂</option>
                            <option value="clothes">買買買</option>
                            <option value="other">其他</option>
                        </select>
                        <button id="add-btn" style="background-color: #c6d5e8; color: #333; font-weight: 500;">新增支出</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= 2. 月曆頁面 ================= -->
        <div id="calendar-page" class="page-view">
            <div class="section-box">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 id="calendar-month-title" style="margin: 0;">2026年 10月</h3>
                    <div>
                        <button id="prev-month-btn">◀ 上個月</button>
                        <button id="next-month-btn">下個月 ▶</button>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; color: #7f8c8d; margin-bottom: 10px;">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>

                <div id="calendar-grid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;"></div>
            </div>
        </div>

        <!-- ================= 3. 預算頁面 (Budget Settings) ================= -->
        <div id="budget-page" class="page-view">
            <div class="section-box">
                <h3 style="margin-top: 0;">預算與固定支出管理</h3>
                <p style="color: #666; margin-bottom: 25px;">在這裡統籌您的荷包防線與自動化開銷設定，讓財務管理更輕鬆：</p>
                
                <!-- 左右雙欄 Grid 排版容器 -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start;">
                    
                    <!-- 左欄：預算管理設定 -->
                    <div style="background: #fdfdfd; padding: 20px; border-radius: 8px; border: 1px solid #eaeaea;">
                        <h4 style="margin-top: 0; color: #333; margin-bottom: 15px;">💰 預算管理設定</h4>
                        <div style="display: flex; flex-direction: column; gap: 12px;">
                            <div>
                                <label style="display: block; font-size: 13px; color: #555; margin-bottom: 5px;">周預算上限：</label>
                                <input type="number" id="weekly-budget" placeholder="例如: 2000" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                            </div>
                            <div>
                                <label style="display: block; font-size: 13px; color: #555; margin-bottom: 5px;">月預算上限：</label>
                                <input type="number" id="monthly-budget" placeholder="例如: 8000" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                            </div>
                            <button id="set-budget-btn" style="margin-top: 10px; background-color: #6d87a6; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">儲存預算設定</button>
                        </div>
                    </div>

                    <!-- 右欄：每月固定支出設定 -->
                    <div style="background: #fdfdfd; padding: 20px; border-radius: 8px; border: 1px solid #eaeaea;">
                        <h4 style="margin-top: 0; color: #333; margin-bottom: 15px;">🔄 每月固定支出設定</h4>
                        <div style="display: flex; flex-direction: column; gap: 12px;">
                            <div>
                                <label style="display: block; font-size: 13px; color: #555; margin-bottom: 5px;">項目名稱：</label>
                                <input type="text" id="fixed-name" placeholder="例如: 房租 / Netflix" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                            </div>
                            <div>
                                <label style="display: block; font-size: 13px; color: #555; margin-bottom: 5px;">固定金額：</label>
                                <input type="number" id="fixed-amount" placeholder="例如: 5000" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                            </div>
                            <div>
                                <label style="display: block; font-size: 13px; color: #555; margin-bottom: 5px;">消費類別：</label>
                                <select id="fixed-category" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                                    <option value="food">吃的喝的</option>
                                    <option value="transport">交通</option>
                                    <option value="entertainment">娛樂</option>
                                    <option value="clothes">買買買</option>
                                    <option value="other">其他</option>
                                </select>
                            </div>
                            <button id="add-fixed-btn" style="margin-top: 10px; background-color: #5b708b; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">新增固定支出項目</button>
                        </div>

                        <!-- 已設定的固定支出列表容器 -->
                        <div style="margin-top: 20px;" id="fixed-list-container">
                            <!-- 動態顯示已儲存的固定支出 -->
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- ================= 4. 統計頁面 (Statistics Charts) ================= -->
        <div id="stats-page" class="page-view">
            <div class="section-box">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 style="margin: 0;">消費比例統計圖表</h3>
                    <button id="export-csv-btn" style="background-color: #bdaac2; color: rgb(255, 255, 255); font-weight: 500; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer;">匯出記帳CSV報表</button>
                </div>
                
                <p id="stats-total-text" style="font-size: 16px; font-weight: bold; color: #333; margin-bottom: 20px;">總支出：$ 0</p>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: center;">
                    <div style="width: 280px; height: 280px; margin: 0 auto; position: relative;">
                        <canvas id="expense-chart"></canvas>
                    </div>
                    <div id="category-stats-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
                </div>
            </div>
        </div>

        <!-- ================= 5. 設定頁面 (Settings) ================= -->
        <div id="settings-page" class="page-view">
            <div class="section-box">
                <h3>帳號與資安設定</h3>
                <p style="color: #666; margin-bottom: 20px;">在此管理您的金庫登入狀態與密碼保護：</p>
                <div id="settings-content" style="display: flex; flex-direction: column; gap: 15px; max-width: 400px;"></div>
                <div class="setting-item" style="margin-top: 20px;">
                    <label for="themeSelector" style="font-weight: bold; display: block; margin-bottom: 8px;">選擇介面色系主題：</label>
                    <div class="theme-btn-group">
                        <button class="theme-btn" id="btn-pink" style="background-color: #dda4ac;" onclick="changeTheme('pink')" title="櫻花粉色系"></button>
                        <button class="theme-btn" id="btn-orange" style="background-color: #d872297b;" onclick="changeTheme('orange')" title="暖橘色系"></button>
                        <button class="theme-btn" id="btn-yellow" style="background-color: #f6dd91;" onclick="changeTheme('yellow')" title="陽光黃色系"></button>
                        <button class="theme-btn" id="btn-green" style="background-color: #b5d4ca;" onclick="changeTheme('green')" title="清新綠色系"></button>
                        <button class="theme-btn" id="btn-default" style="background-color: #b4bdcd;" onclick="changeTheme('default')" title="經典科技藍"></button>
                        <button class="theme-btn" id="btn-purple" style="background-color: #b6b1c4;" onclick="changeTheme('purple')" title="質感紫色系"></button>
                    </div>
                </div>
            </div>
        </div>

    </div> <!-- 這裡正確關閉 .main-content -->

    <!-- 引入外部 JavaScript 邏輯檔 -->
    <script src="script.js"></script>
</body>
</html>
